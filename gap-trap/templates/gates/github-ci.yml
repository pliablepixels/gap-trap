# Reference CI for the gap-trap gates (GitHub Actions). ADAPT: the install
# and test commands, the working directory, and the Node setup if the repo
# is not Node. Make `unit-tests`, `gates`, and `proven-red` required checks
# in branch protection; a check nobody requires is advice.
name: CI

on:
  pull_request:
  push:
    branches: [main]            # ADAPT: the default branch

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # P1: the body quotes the issue's acceptance lines, which the Spec review
  # axis judges the diff against. A feat PR also names its spec. Fork PRs
  # and bots are exempt.
  pr-acceptance:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type != 'Bot'
    steps:
      - uses: actions/checkout@v4
      - name: PR body has acceptance lines, and a spec on a feat
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: sh scripts/pr-body-check.sh

  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The instruction gate checks that cited commit hashes exist.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci                       # ADAPT
      - run: npm run gates                # ADAPT: unit tests, build/type check, blocking lints

  proven-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci                       # ADAPT
      # P2 by machine: the tests this range changed must fail on the code
      # the range replaces. Then the mutation smoke proves existing tests
      # can fail at all.
      # The title goes through env, never into the script text: it is
      # attacker-controlled on a fork PR.
      - name: Changed tests go red on the pre-change code
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.after }}
        run: node scripts/proven-red.mjs "$BASE" "$HEAD" --title "$PR_TITLE"   # ADAPT: sh scripts/proven-red.sh for the shell port
      - run: npm run test:mutation        # ADAPT, or drop until mutation targets exist
