# The gate templates have their own gates. Every case in tests/ was checked to
# go red against the version of the template it guards, so a green run here
# means something (P2).
name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The pytest and vitest ports are run against fixture repos, so both
      # runners have to be here or those cases report themselves as NOT RUN.
      - run: pip install pytest
      - run: npm test
